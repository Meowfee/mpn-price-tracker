name: Daily price check
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 8am Sydney
  workflow_dispatch:        # lets you trigger it manually to test

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth
      - run: python check_price.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
